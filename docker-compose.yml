services:
  app:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      # Keep node_modules inside the container — avoids Windows filesystem performance issues
      - frontend_node_modules:/workspace/src/frontend/node_modules
    ports:
      - "5173:5173"
      - "8000:8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  frontend_node_modules:
